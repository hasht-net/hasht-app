version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      bundler-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
